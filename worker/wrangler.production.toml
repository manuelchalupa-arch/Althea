# ALTHEA — Worker PRODUCTION
#
# Uso (explícito, requiere autorización explícita del propietario):
#   cd worker
#   npx wrangler deploy -c wrangler.production.toml
#   npx wrangler secret put GROQ_API_KEY -c wrangler.production.toml
#
# PROHIBIDO ejecutar este deploy sin autorización del propietario (§29 del
# prompt de cierre). El secret GROQ_API_KEY de producción es DISTINTO del de
# staging.

name = "althea-proxy-production"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Origin real de producción. Debe incluir todos los hosts que sirven el
# frontend de producción, separados por coma (allowlist exacta, sin *).
CORS_ORIGIN = "https://althea-4b1d0.web.app,https://althea.app,https://www.althea.app"
GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"
GROQ_TIMEOUT_MS = "60000"
WGER_TIMEOUT_MS = "15000"

# Rate limit. Capa 1 (preferida): Durable Object, contador strongly consistent.
# Es la unica que es boundary de seguridad real en el edge distribuido.
# NOTA: la migracion se crea una vez por Worker. Si el Worker de produccion
# ya tiene una migracion con el mismo tag, incrementar el tag (v2, v3...).
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Capa 2 (degradacion): KV namespace. Namespace SEPARADO del de staging:
#   creado 2026-10-20: RATE_LIMIT_PRODUCTION -> 598bd1ae4ca9455ab86181d59ae69217
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "598bd1ae4ca9455ab86181d59ae69217"

# Secrets (server-side, NUNCA en el frontend ni en Git):
#   npx wrangler secret put GROQ_API_KEY -c wrangler.production.toml
