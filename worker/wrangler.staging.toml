# ALTHEA — Worker STAGING
#
# Uso (explícito, nunca implícito):
#   cd worker
#   npx wrangler deploy -c wrangler.staging.toml
#   npx wrangler secret put GROQ_API_KEY -c wrangler.staging.toml
#
# Este archivo NUNCA debe apuntar al Worker de producción.
# El secret GROQ_API_KEY de staging es DISTINTO del de producción.

name = "althea-proxy-staging"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Fail-closed: si CORS_ORIGIN falta, el Worker responde 500 (no hay fallback a *).
# Reemplazar por el origin real de staging ANTES del primer deploy.
CORS_ORIGIN = "https://STAGING_PROJECT_ID.web.app"
GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"
GROQ_TIMEOUT_MS = "60000"
WGER_TIMEOUT_MS = "15000"

# Rate limit. Capa 1 (preferida): Durable Object, contador strongly consistent.
# Es la unica que es boundary de seguridad real en el edge distribuido.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Capa 2 (degradacion): KV namespace. Eventualmente consistente; frena abuso
# trivial pero NO es un techo estricto.
#   npx wrangler kv namespace create RATE_LIMIT -c wrangler.staging.toml
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REEMPLAZAR_KV_NAMESPACE_ID_STAGING"

# Secrets (server-side, NUNCA en el frontend ni en Git):
#   npx wrangler secret put GROQ_API_KEY -c wrangler.staging.toml
