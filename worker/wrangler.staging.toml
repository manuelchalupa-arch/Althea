# ALTHEA — Worker STAGING
#
# Uso (explícito, nunca implícito):
#   cd worker
#   npx wrangler deploy -c wrangler.staging.toml
#
# Este archivo NUNCA debe apuntar al Worker de producción.
# Sin secretos de proveedor: se usa el binding `AI` de la cuenta staging.

name = "althea-proxy-staging"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Fail-closed: si CORS_ORIGIN falta, el Worker responde 500 (no hay fallback a *).
# Origen de staging: dominio por defecto de Firebase Hosting para el proyecto
# `althea-stg` (creado 2026-10-21; el ID `althea-staging` ya existía ajeno).
# Debe seguir siendo DISTINTO al de producción.
CORS_ORIGIN = "https://althea-stg.web.app"
# Identidad: debe coincidir con VITE_FIREBASE_PROJECT_ID del frontend staging.
FIREBASE_PROJECT_ID = "althea-stg"
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AI_TIMEOUT_MS = "60000"
AI_MAX_CONCURRENCY = "6"
AI_DAILY_NEURON_BUDGET = "9000"

# Binding de Cloudflare Workers AI (sin claves ni tokens en el frontend).
[ai]
binding = "AI"

# Rate limit. Capa 1 (preferida): Durable Object, contador strongly consistent.
# Es la unica que es boundary de seguridad real en el edge distribuido.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# Capa 2 (degradacion): KV namespace. Eventualmente consistente; frena abuso
# trivial pero NO es un techo estricto.
# Namespace CREADO: 0f643e89b72743f197bd851c4dd9146e (cuenta staging).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "0f643e89b72743f197bd851c4dd9146e"

# No hay secrets de IA: el binding `AI` usa la identidad de la cuenta.
