name: Deploy Cloudflare Pages and AI Worker

# La publicación de producción se ejecuta ÚNICAMENTE después de que la CI
# completa haya terminado con éxito en main. Nunca compite con sus pruebas.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 170d478ee67d5da8036859410f64be3a
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # Firebase Web config is public client configuration (not a secret).
      # It is injected only at build time for the fixed production project.
      VITE_FIREBASE_API_KEY: AIzaSyCboMMOUuUhtqp96bVoN_WZaWhbv9ou-5I
      VITE_FIREBASE_AUTH_DOMAIN: althea-4b1d0.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: althea-4b1d0
      VITE_FIREBASE_STORAGE_BUCKET: althea-4b1d0.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "756631647991"
      VITE_FIREBASE_APP_ID: 1:756631647991:web:919921eaee888115cbc5f2
      VITE_GROQ_PROXY_URL: https://althea-proxy-production.manuelchalupa.workers.dev
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Confirm validated SHA is still current main
        id: freshness
        env:
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$UPSTREAM_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping stale CI result $UPSTREAM_SHA; main is now $latest."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require Cloudflare deployment credentials
        if: steps.freshness.outputs.current == 'true'
        run: |
          if [ "${HAS_CLOUDFLARE_TOKEN}" != "true" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN; no se publica producción."
            exit 1
          fi
      - name: Validate production build configuration
        if: steps.freshness.outputs.current == 'true'
        run: |
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Configuración pública de build incompleta: falta ${name}."
              exit 1
            fi
          done
          test "$VITE_FIREBASE_PROJECT_ID" = "althea-4b1d0"
      - name: Install locked dependencies
        if: steps.freshness.outputs.current == 'true'
        run: npm ci
      - name: Build production bundle
        if: steps.freshness.outputs.current == 'true'
        run: npm run build
      - name: Check release bundle
        if: steps.freshness.outputs.current == 'true'
        run: npm run check:release
      - name: Deploy production AI Worker
        if: steps.freshness.outputs.current == 'true'
        run: npx wrangler@4.156.0 deploy --config worker/wrangler.production.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy to Cloudflare Pages
        if: steps.freshness.outputs.current == 'true'
        run: npx wrangler@4.156.0 pages deploy dist --project-name=altheafit --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify production Worker reachability and Pages CORS
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output /tmp/althea-worker-body.json --dump-header /tmp/althea-worker-headers.txt --write-out '%{http_code}' \
            --request POST 'https://althea-proxy-production.manuelchalupa.workers.dev' \
            --header 'Origin: https://altheafit.pages.dev' \
            --header 'Content-Type: application/json' \
            --data '{"task":"routine","messages":[{"role":"user","content":"health-check"}]}')
          test "$status" = "401"
          grep -qi '^access-control-allow-origin: https://altheafit.pages.dev' /tmp/althea-worker-headers.txt
          grep -q '"error":"unauthorized"' /tmp/althea-worker-body.json
          echo "Worker reachable, production CORS accepted, Firebase authentication enforced."
