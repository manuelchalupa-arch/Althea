name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Cuenta Candiote (owner: manuelchalupa-arch). El token va en el secret
      # CLOUDFLARE_API_TOKEN (permiso "Cloudflare Pages — Edit"). Sin él, el
      # paso de deploy se salta en vez de dejar el run en rojo.
      CLOUDFLARE_ACCOUNT_ID: 170d478ee67d5da8036859410f64be3a
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      # Mismas env públicas que netlify.toml (van al bundle del navegador).
      VITE_FIREBASE_API_KEY: AIzaSyCboMMOUuUhtqp96bVoN_WZaWhbv9ou-5I
      VITE_FIREBASE_AUTH_DOMAIN: althea-4b1d0.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: althea-4b1d0
      VITE_FIREBASE_STORAGE_BUCKET: althea-4b1d0.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: 756631647991
      VITE_FIREBASE_APP_ID: 1:756631647991:web:919921eaee888115cbc5f2
      VITE_GROQ_PROXY_URL: https://althea-proxy-production.manuelchalupa.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        # Comando directo (probado local): wrangler-action no resolvía la
        # cuenta con el token de cuenta y wrangler abortaba en /memberships.
        run: npx wrangler@4.156.0 pages deploy dist --project-name=altheafit --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
