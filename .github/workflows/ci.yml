name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # El build va ANTES de los tests: bundleBudget.test.ts mide dist/ y en CI
      # es obligatorio (falla si falta dist), no un skip silencioso.
      - run: npm run build
      - run: npx vitest run
      - run: npm run check:release
