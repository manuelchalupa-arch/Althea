# Netlify — configuración de build de ALTHEA
#
# Netlify clona el repo y NO tiene los archivos .env (están en .gitignore),
# así que las variables de build de Vite se declaran ACÁ (todas PÚBLICAS:
# van al bundle del navegador; ningún secreto vive en VITE_*).
#   build: npm run build · publish: dist · SPA fallback: public/_redirects
#
# El secret de Groq vive sólo en el Cloudflare Worker (VITE_GROQ_PROXY_URL
# apunta al proxy, nunca a Groq directamente).

