  VITE_FIREBASE_API_KEY = "AIzaSyCboMMOUuUhtqp96bVoN_WZaWhbv9ou-5I"
  VITE_FIREBASE_AUTH_DOMAIN = "althea-4b1d0.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "althea-4b1d0"
  VITE_FIREBASE_STORAGE_BUCKET = "althea-4b1d0.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "756631647991"
  VITE_FIREBASE_APP_ID = "1:756631647991:web:919921eaee888115cbc5f2"
  VITE_GROQ_PROXY_URL = "https://althea-proxy-production.manuelchalupa.workers.dev"
